name: Build Windows host
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath .
          $dir = Get-ChildItem -Directory -Filter "ffmpeg-*" | Select-Object -First 1
          Rename-Item $dir.Name ffmpeg
      - name: Build
        shell: pwsh
        run: |
          $ff = (Resolve-Path ffmpeg).Path -replace '\\','/'
          cmake -S host -B build -A x64 -DFFMPEG_DIR="$ff"
          cmake --build build --config Release
          Copy-Item ffmpeg/bin/*.dll build/Release/
      - uses: actions/upload-artifact@v4
        with:
          name: PenLink-host-windows
          path: build/Release
