
name: Build Windows host

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath .
          $dir = Get-ChildItem -Directory -Filter "ffmpeg-*" | Select-Object -First 1
          if (-not $dir) { throw "FFmpeg directory not found" }
          Rename-Item -Path $dir.FullName -NewName ffmpeg

      - name: Build
        shell: pwsh
        run: |
          $ff = (Resolve-Path ffmpeg).Path -replace '\\','/'
          cmake -S host -B build -A x64 -DFFMPEG_DIR="$ff"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item ffmpeg/bin/*.dll build/Release/

      - uses: actions/upload-artifact@v4
        with:
          name: PenLink-host-windows
          path: build/Release
